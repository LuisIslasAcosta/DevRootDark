<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0c18" />
  <title>DevRootDark - Sin conexión</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #0a0c18; color: #ebebf0; font-family: system-ui, Arial, sans-serif; text-align: center; }
    .card { max-width: 420px; padding: 32px; }
    img { width: 100%; max-width: 380px; height: auto; }
    h1 { color: #2ee5c6; margin: 20px 0 8px; font-size: 1.6rem; }
    p { color: #b8b8c2; line-height: 1.5; }
    button { margin-top: 16px; padding: 10px 22px; border: 0; border-radius: 8px;
             background: #2ee5c6; color: #0a0c18; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/logo-banner.png" alt="DevRootDark" />
    <h1>Sin conexión</h1>
    <p>No hay internet en este momento. Cuando vuelvas a tener conexión podrás seguir con tus cursos.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
